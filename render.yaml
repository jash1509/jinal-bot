# Deploy Jinal Bots to Render: https://render.com/deploy?repo=https://github.com/jash1509/jinal-bot
# Render keeps files only on a persistent disk, and disks need a paid instance (Starter or up),
# so this Blueprint asks for one. The sign-in token is made by Render: open the service's
# Environment page and copy JINAL_BOT_API_TOKEN.
services:
  - type: web
    name: jinal-bot
    runtime: docker
    dockerfilePath: ./docker/render.Dockerfile
    dockerContext: ./docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8799"
      - key: KWNT_API_TOKEN
        generateValue: true
      - key: KWNT_SIGNIN_HINT
        value: "Use the token Render generated: open this service's Environment page on Render and copy KWNT_API_TOKEN."
    disk:
      name: jinal-bot-data
      mountPath: /data
      sizeGB: 1
